# PROJECT_MANIFEST.yaml
# =====================================================================
# Project: Singapore Scale-Dependent Mobility Laws
# Updated: 2026-04-10 (After R2 removal and MLE update)
# Purpose: Metadata for LLM to verify findings in draft_scientific_paper.md
# =====================================================================

report:
  file: draft_scientific_paper.md
  thesis: "Human mobility follows a scale-dependent phase transition (LN -> Gamma -> SPL/TLF)"

# =========================
# INPUT DATA (RAW)
# =========================
raw_data:
  - file: data_trip_sum.csv
    desc: "Weekly aggregated trips between Singapore subzones"
  - file: zone_euclid_distances.csv
    desc: "Euclidean distances (km) for all OD pairs"
  - file: district_zone.csv
    desc: "Subzone to District mapping"
  - file: singapore_40_regions.csv
    desc: "Clustering of subzones into 40 groups for intermediate scale"

# ==================================================
# PIPELINE: Script → Data Output → Findings
# ==================================================
pipeline:

  # ─── MICRO SCALE: Subzone (n=303) ───
  - id: micro_scale
    report_section: "4.1"
    table: "Table 1b"
    scripts:
      - compare_distribution_formular.py    # Per-subzone MLE fitting
      - bootstrap_block_table1.py           # District-block bootstrap CIs
    outputs:
      data: [zone_distribution_metrics.csv, bootstrap_table1_ci.csv]
      figures: [model_dominance_subzone.png]
    key_findings:
      - "Lognormal BIC Dominance = 59.74% (181/303 subzones)"
      - "95% BIC CI for LN: [45.6%, 66.9%]"
      - "Lognormal also leads AD-stat (57.8%)"
      - "Gamma is secondary (34.7%)"


  # ─── INTERMEDIATE SCALE: 40 Groups (n=34) ───
  - id: intermediate_scale
    report_section: "4.2"
    table: "Table 2b"
    scripts:
      - group_subzones.py                   # Agglomerative clustering with connectivity
      - compare_distribution_40groups.py    # Per-group MLE fitting
    outputs:
      data: [group_40_distribution_metrics.csv, group_40_dominance_by_metric.csv]
      figures: [group_40_dominance_by_metric.png, group_40_distribution_comparison.png]
    key_findings:
      - "Gamma emerges as winner: 58.8% BIC"
      - "Gamma also dominates AD-stat (55.9%)"
      - "Lognormal drops to 29.4%"


  # ─── MACRO SCALE: 5 Districts (n=5) ───
  - id: macro_scale
    report_section: "4.3"
    table: "Table 3b"
    script: compare_distribution_formular_district.py
    outputs:
      data: [district_distribution_metrics.csv, district_dominance_by_metric.csv]
      figures: [district_dominance_by_metric.png, bic_logic_illustration.png]
    key_findings:
      - "Gamma and TLF tie for BIC (40% each)"
      - "Lognormal fails BIC (0%) but leads AD-stat (80%)"
      - "SPL leads KS-stat (Tail advantage)"


  # ─── GLOBAL SCALE: Singapore-wide (n=1) ───
  - id: global_scale
    report_section: "4.4"
    table: "Table 4"
    script: calculate_global_metrics.py
    outputs:
      data: []
      figures: [distance_histogram.png, distance_loglog.png, distance_ccdf.png]
    key_findings:
      - "Lognormal recovers BIC dominance (38.82M)"
      - "SPL still leads KS-stat (0.1096)"
      - "Gamma leads AD-stat (5.25M), showing best overall tail-body balance"


  # ─── CONCEPTUAL & VISUAL PROOF ───
  - id: phase_transition_visuals
    report_section: "4.5"
    scripts:
      - generate_distribution_morphing.py
    figures:
      - distribution_morphing.png           # Showcases PDF change from LN to SPL
    diagrams:
      - Mobility Phase Transition (Mermaid)
      - Myth vs Reality (Mermaid)

# =========================================
# VERIFICATION (Quick checks for LLM)
# =========================================
verification_commands:
  check_subzone_lead: |
    python3 -c "import pandas as pd; df = pd.read_csv('model_dominance_by_metric.csv'); print(df[df['Metric']=='Best_BIC'])"
  check_group_lead: |
    python3 -c "import pandas as pd; df = pd.read_csv('group_40_dominance_by_metric.csv'); print(df[df['Metric']=='Best_BIC'])"
  check_global_bic: |
    python3 calculate_global_metrics.py
