# PROJECT_MANIFEST.yaml
# =====================================================================
# Cấu trúc dự án: Singapore Mobility Distribution Analysis
# Dùng cho LLM đọc nhanh và kiểm chứng số liệu trong báo cáo.
#
# Quy ước:
#   report   = file báo cáo chính
#   script   = code Python tạo ra dữ liệu
#   data_in  = file dữ liệu đầu vào (raw)
#   data_out = file dữ liệu đầu ra (kết quả từ script)
#   figure   = hình ảnh xuất ra từ script
#   status   = VERIFIED (số khớp CSV) | UNUSED (không dùng trong report)
# =====================================================================

report:
  file: draft_scientific_paper.md
  title: "Individual habits vs Urban Gravity: Scale-dependent mobility transition in Singapore"

# =========================
# DỮ LIỆU ĐẦU VÀO (RAW)
# =========================
raw_data:
  - file: data_trip_sum.csv
    desc: "Số lượng chuyến đi theo tuần giữa các cặp subzone (ORIGIN_SUBZONE, DESTINATION_SUBZONE, COUNT)"
    rows: "~91,000 cặp OD"
    note: "weekly-aggregated, KHÔNG có timestamp"

  - file: zone_euclid_distances.csv
    desc: "Khoảng cách Euclidean (km) giữa các cặp subzone"
    columns: [ORIGIN_SUBZONE, DESTINATION_SUBZONE, euclidean_distance_km]

  - file: district_zone.csv
    desc: "Ánh xạ subzone → district (zone_id, district_id, district_name)"
    districts: [Central, East, North, North-East, West]

  - file: fb_agg.csv
    desc: "Facebook Mobility Data tổng hợp theo district và distance bin"
    columns: [district_id, category, p_fb]
    bins: ["(0,1)", "[1, 10)", "[10, 100)", "100+"]

  - file: detail_pois.geojson
    desc: "POI từ OpenStreetMap theo subzone"
    columns: [SUBZONE_C, SUBZONE_N, amenity, leisure, office, public_transport, shop, tourism]

# ==================================================
# PIPELINE: Script → Data Output → Report Section
# ==================================================

pipeline:

  # ─── TABLE 1: Micro-scale (303 subzones) ───
  - id: table1
    report_section: "4.1"
    report_table: "Table 1"
    status: VERIFIED
    script: compare_distribution_formular.py
    inputs: [data_trip_sum.csv, zone_euclid_distances.csv]
    outputs:
      data: zone_distribution_metrics.csv
      figures: [zone_distribution_metrics.png, zone_distribution_metrics_best.png]
    numbers_in_report:
      - "Lognormal BIC Best = 28.05%"
      - "Lognormal Mean R² = 0.8199"
      - "Lognormal Mean KS = 0.1492"
      - "SPL BIC Best = 28.05%"
      - "SPL Mean R² = 0.6998"
      - "SPL Mean KS = 0.0935"
      - "Gamma BIC Best = 24.09%"
      - "Exponential BIC Best = 16.50%"
      - "TLF BIC Best = 3.30%"

  # ─── TABLE 2: Macro-scale (5 districts) ───
  - id: table2
    report_section: "4.2"
    report_table: "Table 2"
    status: VERIFIED
    script: compare_distribution_formular_district.py
    inputs: [data_trip_sum.csv, zone_euclid_distances.csv, district_zone.csv]
    outputs:
      data: district_distribution_metrics.csv
      figures: [district_distribution_metrics.png, district_distribution_metrics_best.png]
    numbers_in_report:
      - "SPL BIC Best = 40.0%"
      - "TLF KS-stat = 0.0465"

  # ─── TABLE 3: POI Efficiency Φ(d) ───
  - id: table3_global
    report_section: "4.3"
    report_table: "Table 3 (Global row)"
    status: VERIFIED
    script: analyze_poi_attraction.py
    inputs: [data_trip_sum.csv, zone_euclid_distances.csv, detail_pois.geojson]
    outputs:
      data: poi_analysis_results.csv
      figures: [poi_attraction_analysis.png]
    numbers_in_report:
      - "Global R² Lognormal = 0.9769"
      - "Global R² SPL = 0.9768"
      - "n bins = 43"

  - id: table3_districts
    report_section: "4.3"
    report_table: "Table 3 (District rows)"
    status: VERIFIED
    script: analyze_poi_attraction_districts.py
    inputs: [data_trip_sum.csv, zone_euclid_distances.csv, detail_pois.geojson, district_zone.csv]
    outputs:
      data: district_poi_results.csv
      figures: [district_poi_analysis.png]
    numbers_in_report:
      - "North-East R²_LN = 0.9315, R²_SPL = 0.9240"
      - "East R²_LN = 0.7332, R²_SPL = 0.5146"
      - "West R²_LN = 0.8647, R²_SPL = 0.8624"
      - "Central R²_LN = 0.8025, R²_SPL = 0.7700"
      - "North R²_LN = 0.7034, R²_SPL = 0.6216"
      - "Mean R²_LN = 0.8071, Mean R²_SPL = 0.7385"

  # ─── TABLE 4: Facebook EMD ───
  - id: table4
    report_section: "4.4"
    report_table: "Table 4"
    status: VERIFIED
    script: compare_fb_pl.py
    inputs: [data_trip_sum.csv, zone_euclid_distances.csv, district_zone.csv, fb_agg.csv]
    outputs:
      data: fb_vs_pl.csv
      figures: [fb_vs_pl.png, fb_vs_pl_best.png]
    note: "Script chỉ so sánh SPL vs Facebook. Chỉ tính Overall Wasserstein per district."
    numbers_in_report:
      - "North-East: MAE=0.1540, RMSE=0.1943, EMD=0.1123, KL=0.4830"
      - "East: MAE=0.1553, RMSE=0.1879, EMD=0.0583, KL=0.6585"
      - "West: MAE=0.1425, RMSE=0.1739, EMD=0.0756, KL=0.4263"
      - "Central: MAE=0.1446, RMSE=0.1853, EMD=0.1135, KL=0.3998"
      - "North: MAE=0.1385, RMSE=0.1784, EMD=0.0549, KL=0.4242"
      - "Mean EMD = 0.0829"

  # ─── FIGURES (không gắn table) ───
  - id: fig_distribution_comparison
    report_section: "2 (Introduction)"
    status: VERIFIED
    script: distribute_curve.py
    inputs: [data_trip_sum.csv, zone_euclid_distances.csv]
    outputs:
      figures: [distribution_comparison.png]

  - id: fig_bic_illustration
    report_section: "4.2"
    status: VERIFIED
    script: plot_bic_logic_illustration.py
    inputs: [district_distribution_metrics.csv]
    outputs:
      figures: [bic_logic_illustration.png]

# =========================================
# CÁC SCRIPT/FILE KHÔNG DÙNG TRONG BÁO CÁO
# =========================================
unused_files:
  scripts:
    - file: uncertainty_analysis.py
      desc: "Bootstrap SPL parameters (β, r₀, C) cho 5 districts — 200 iterations"
      output: [spl_parameter_uncertainty.csv, spl_parameter_uncertainty.png]
      reason: "Kết quả không được trích dẫn trong báo cáo hiện tại"

    - file: calc_euclidean.py
      desc: "Tính khoảng cách Euclidean từ shapefile"
      reason: "Đã có sẵn zone_euclid_distances.csv"

    - file: calculate_table3_extended.py
      desc: "Phiên bản mở rộng Table 3"
      reason: "Không sử dụng"

    - file: compare_fb_gt.py
      desc: "So sánh Facebook vs Ground Truth"
      reason: "Thay bằng compare_fb_pl.py"

    - file: zone_distributions.py
      desc: "Phân tích phân phối zone (phiên bản cũ)"
      reason: "Thay bằng compare_distribution_formular.py"

    - file: validate_scale_transition.py
      desc: "Validation scale transition"
      reason: "Không có output trong báo cáo"

    - file: plot_spatial_boundaries.py
      desc: "Vẽ bản đồ Singapore"
      output: [singapore_districts.png, singapore_subzones.png]
      reason: "Hình không dùng trong báo cáo hiện tại"

    - file: generate_table.py
      desc: "Script sinh bảng (phiên bản cũ)"
      reason: "Không sử dụng"

    - file: test_scale_free_property.py
      desc: "Kiểm tra tính scale-free"
      output: [scale_free_check.png]
      reason: "Không dùng trong báo cáo"

    - file: radiation_model.py
      desc: "Radiation model"
      reason: "Không dùng trong báo cáo"

    - file: plot_distribution_function.py
      desc: "Vẽ distribution function (phiên bản cũ)"
      output: [distribution_function.png]
      reason: "Thay bằng distribute_curve.py"

  data:
    - file: zone_distribution_results.csv
      reason: "Phiên bản cũ, thay bằng zone_distribution_metrics.csv"
    - file: fb_vs_gt_merged.csv
      reason: "Output từ compare_fb_gt.py (không dùng)"

  figures:
    - file: scale_transition_validation.png
      reason: "Từ validate_scale_transition.py (không dùng)"
    - file: scale_free_check.png
      reason: "Từ test_scale_free_property.py (không dùng)"
    - file: distribution_function.png
      reason: "Phiên bản cũ"
    - file: singapore_districts.png
      reason: "Không dùng trong báo cáo hiện tại"
    - file: singapore_subzones.png
      reason: "Không dùng trong báo cáo hiện tại"

# =========================================
# KIỂM CHỨNG NHANH (cho LLM)
# =========================================
verification_commands:
  table1: |
    python3 -c "
    import pandas as pd
    z = pd.read_csv('zone_distribution_metrics.csv')
    best = z[z['Is_Best_BIC']==True]
    for m in ['Lognormal','Shifted Power-Law','Gamma','Exponential','Truncated Lévy Flight']:
      s = z[z['Model']==m]
      print(f'{m}: BIC={best[best[\"Model\"]==m].shape[0]/len(best)*100:.2f}% R2={s[\"R2\"].mean():.4f} KS={s[\"KS_Stat\"].mean():.4f}')
    "

  table2: |
    python3 -c "
    import pandas as pd
    d = pd.read_csv('district_distribution_metrics.csv')
    best = d[d['Is_Best_BIC']==True]
    for m in ['Shifted Power-Law','Exponential','Gamma','Lognormal','Truncated Lévy Flight']:
      s = d[d['Model']==m]
      print(f'{m}: BIC={best[best[\"Model\"]==m].shape[0]/len(best)*100:.1f}% R2={s[\"R2\"].mean():.4f} KS={s[\"KS_Stat\"].mean():.4f}')
    "

  table3: |
    python3 -c "
    import pandas as pd; print(pd.read_csv('district_poi_results.csv').to_string(index=False))
    "

  table4: |
    python3 -c "
    import pandas as pd; print(pd.read_csv('fb_vs_pl.csv').to_string(index=False))
    "
